[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: el router es por estado, no por rutas, pero recargar en cualquier URL
# tiene que devolver el index igual.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker no puede cachearse: si queda viejo, la app nunca se actualiza.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los assets llevan hash en el nombre: se cachean para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
